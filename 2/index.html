<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Sample 2</title>
</head>
<body>
    <h1>Text Concatenator</h1>
    <table>
        <tr>
            <td>
                <label for="first">First Name:</label>
            </td>
            <td>
                <input type="text" name="num1" id="first" placeholder="Enter first name">
            </td>
        </tr>
                <tr>
            <td>
                <label for="middle">Middle Name:</label>
            </td>
            <td>
                <input type="text" name="num2" id="middle" placeholder="Enter middle name">
            </td>
        </tr>
        <tr>
            <td>
                <label for="last">Last Name:</label>
            </td>
            <td>
                <input type="text" name="num3" id="last" placeholder="Enter last name">
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button onclick="concatenate()">Concatenate</button>
                <button onclick="clearEntries()">Clear Entries</button>
            </td>
        </tr>
    </table>

    <p style="font-weight: bold;">Concatenated Value:</p>
    <span id="sum"></span>

    <script src="name.js"></script>
</body>
</html>
